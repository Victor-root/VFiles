apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'

apply from: '../signing.gradle'

android {
    namespace 'me.zhanghai.android.files'
    buildToolsVersion = '37.0.0'
    compileSdk = 36
    ndkVersion '28.1.13356709'
    defaultConfig {
        applicationId 'fr.vroot.vfiles'
        minSdk 23
        // Not supporting foreground service timeout yet.
        //noinspection OldTargetApi
        targetSdk 34
        versionCode 41
        versionName '1.8.1'
        resValue 'string', 'app_version', versionName + ' (' + versionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDIER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        buildConfigField 'String', 'DOCUMENTS_PROVIDER_AUTHORITY', 'APPLICATION_ID + ".documents"'
        resValue 'string', 'app_provider_authority', applicationId + '.app_provider'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
        resValue 'string', 'documents_provider_authority', applicationId + '.documents'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
        resValues true
        viewBinding true
    }
    androidResources {
        generateLocaleConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    lint {
        // For "Invalid package reference in library; not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    buildTypes {
        debug {
            // Sign debug builds (the green-triangle install) with the release key too, when
            // keystore.properties is present, so they share a signature with the published release
            // APK. Without that shared signature you can't install one over the other without
            // uninstalling first. Guarded so builds without keystore.properties are unaffected.
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'org/bouncycastle/pqc/crypto/picnic/*'
            ]
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

// Opt-in "systemPicker" flavor for ROM integrators (see docs/systempicker-integration.md).
//
// Enabled only when the build is invoked with -PsystemPicker; without that property NO product
// flavor is registered, so the standard build is completely unchanged - same "assembleRelease"
// task, same output directory, same merged manifest (no MANAGE_DOCUMENTS), same BuildConfig. The
// only delta this file adds to a standard build is this if-block, which does not execute.
//
// The flavor's sole build-time effect is merging app/src/systemPicker/AndroidManifest.xml (which
// adds the MANAGE_DOCUMENTS permission). The URI-emission code lives in the main source set and is
// gated at runtime on actually holding that permission, so it stays inert unless the flavor build
// is signed with the platform key.
if (project.hasProperty('systemPicker')) {
    android {
        flavorDimensions 'documents'
        productFlavors {
            systemPicker {
                dimension 'documents'
            }
        }
    }
}

// Always name the assembled APK "VFiles-v<versionName>.apk" so the file name carries the
// current version. This is the name users see on the GitHub Releases page. Uses AGP's new
// variant API (the legacy applicationVariants was removed in newer AGP).
def appVersionName = android.defaultConfig.versionName
androidComponents {
    onVariants(selector().all()) { variant ->
        // Best-effort: this is a cosmetic rename, so never let a variant-API difference fail
        // the build over it.
        try {
            variant.outputs.each { output ->
                output.outputFileName.set("VFiles-v${appVersionName}.apk")
            }
        } catch (Throwable t) {
            logger.warn("APK rename skipped: ${t.message}")
        }
    }
}

repositories {
    // Bundled offline Maven repository (see local-maven/). dav4jvm is served from here instead
    // of JitPack, which no longer provides an artifact for the pinned commit.
    maven {
        url uri("$rootDir/local-maven")
    }
    maven {
        url 'https://jitpack.io'
    }
}
dependencies {
    // We need https://github.com/bitfireAT/dav4jvm/commit/c1bc14348831bcdb00f3a6eec4859b81c7dc3728
    implementation('com.github.bitfireAT:dav4jvm:02fe1a95e6') {
        exclude group: 'org.ogce', module: 'xpp3'
    }
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.github.topjohnwu.libsu:service:5.2.2'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

    // kotlinx-coroutines-android depends on kotlin-stdlib-jdk8
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    def kotlinx_coroutines_version = '1.10.2'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinx_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinx_coroutines_version"

    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    def androidx_lifecycle_version = '2.10.0'
    implementation "androidx.lifecycle:lifecycle-common-java8:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidx_lifecycle_version"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'com.drakeet.drawer:drawer:1.0.3'
    implementation 'com.h6ah4i.android.materialshadowninepatch:materialshadowninepatch:1.0.0'
    implementation 'com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0'
    // SMBJ 0.12.0 broke anonymous authentication: https://github.com/hierynomus/smbj/issues/792 ,
    // and it's still an issue in 0.14.0 according to
    // https://github.com/hierynomus/smbj/issues/792#issuecomment-2548018378 .
    //noinspection NewerVersionAvailable
    implementation ('com.hierynomus:smbj:0.11.5') {
        // org.bouncycastle:bcprov-jdk15on uses bytecode version unsupported by Jetifier, so use
        // org.bouncycastle:bcprov-jdk15to18 instead.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    def bouncy_castle_version = '1.83'
    implementation "org.bouncycastle:bcprov-jdk15to18:$bouncy_castle_version"
    implementation ('com.hierynomus:sshj:0.40.0') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    }
    implementation "org.bouncycastle:bcpkix-jdk15to18:$bouncy_castle_version"
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation ('com.rapid7.client:dcerpc:0.12.13') {
        // SMBJ-RPC depends on the JRE flavor of Guava which targets Java 8.
        exclude group: 'com.google.guava', module: 'guava'
        // Prevent promotion of SMBJ version to 0.12.2.
        exclude group: 'com.hierynomus', module: 'smbj'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation 'com.google.guava:guava:33.5.0-android'
    // Guava conflicts with com.google.guava:listenablefuture:1.0 pulled in by AndroidX Core
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    implementation 'com.takisoft.preferencex:preferencex:1.1.0'
    implementation 'commons-net:commons-net:3.13.0'
    // LicensesDialog 2.2.0 pulls in androidx.webkit and uses setForceDark() instead of correctly
    // setting colors.
    //noinspection NewerVersionAvailable
    implementation 'de.psdev.licensesdialog:licensesdialog:2.1.0'
    // dev.chrisbanesinsetter:insetter:0.6.0 makes inset unstable when entering immersive.
    implementation 'dev.chrisbanes:insetter-ktx:0.3.1'
    implementation 'dev.rikka.rikkax.preference:simplemenu-preference:1.0.3'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation ('eu.agno3.jcifs:jcifs-ng:2.1.10') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation platform('io.coil-kt:coil-bom:2.7.0')
    implementation 'io.coil-kt:coil'
    implementation 'io.coil-kt:coil-gif'
    implementation 'io.coil-kt:coil-svg'
    implementation 'io.coil-kt:coil-video'
    implementation 'me.zhanghai.android.appiconloader:appiconloader:1.5.0'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'
    implementation 'me.zhanghai.android.foregroundcompat:library:1.0.2'
    implementation 'me.zhanghai.android.libarchive:library:1.1.6'
    implementation 'me.zhanghai.android.libselinux:library:2.1.1'
    implementation 'me.zhanghai.android.retrofile:library:1.2.0'
    implementation 'me.zhanghai.android.systemuihelper:library:1.0.0'
    implementation 'org.apache.ftpserver:ftpserver-core:1.2.1'
    // This is a dependency of org.apache.ftpserver:ftpserver-core but org.apache.mina:mina-core
    // 2.1.4+ became incompatible before API 24 due to dependency on StandardSocketOptions
    // (DIRMINA-1123) and NetworkChannel.supportedOptions() (DIRMINA-1130).
    implementation ('org.apache.mina:mina-core') {
        version {
            strictly '2.1.3'
        }
    }
    // Also a dependency of jCIFS-NG.
    implementation 'org.slf4j:slf4j-android:1.7.36'
}
