[versions]
agp = "9.4.1"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
androidx-lifecycle = "2.11.0"
bouncycastle = "1.86"
coil = "3.6.3"
compose-bom = "2026.09.00"
roborazzi = "1.77.0"

[libraries]
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

androidx-activity = { module = "androidx.activity:activity-ktx", version = "1.13.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx-core = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version = "6.0.0" }

androidx-test-core = { module = "androidx.test:core-ktx", version = "1.7.0" }
junit = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version = "4.17" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

androidsvg = { module = "com.caverock:androidsvg-aar", version = "1.4" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bouncycastle" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
coil-bom = { module = "io.coil-kt.coil3:coil-bom", version.ref = "coil" }
coil = { module = "io.coil-kt.coil3:coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg" }
coil-video = { module = "io.coil-kt.coil3:coil-video" }
commons-net = { module = "commons-net:commons-net", version = "3.13.0" }
# We need https://github.com/bitfireAT/dav4jvm/commit/c1bc14348831bcdb00f3a6eec4859b81c7dc3728 ,
# and this is the last commit built on OkHttp (later releases moved to Ktor).
dav4jvm = { module = "com.github.bitfireAT:dav4jvm", version = "02fe1a95e6" }
dcerpc = { module = "com.rapid7.client:dcerpc", version = "0.12.13" }
ftpserver-core = { module = "org.apache.ftpserver:ftpserver-core", version = "1.2.1" }
guava = { module = "com.google.guava:guava", version = "33.7.2-android" }
# Guava conflicts with com.google.guava:listenablefuture:1.0 pulled in by AndroidX Core.
guava-listenablefuture = { module = "com.google.guava:listenablefuture", version = "9999.0-empty-to-avoid-conflict-with-guava" }
# dev.chrisbanes.insetter:insetter 0.6.0 makes insets unstable when entering immersive.
jcifs-ng = { module = "eu.agno3.jcifs:jcifs-ng", version = "2.1.10" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version = "6.0.0" }
# LicensesDialog 2.2.0 pulls in androidx.webkit and uses setForceDark() instead of correctly setting
# colors.
mina-core = { module = "org.apache.mina:mina-core", version = "2.2.10" }
shizuku-api = { module = "dev.rikka.shizuku:api", version = "13.1.5" }
# SMBJ 0.12.0 broke anonymous authentication: https://github.com/hierynomus/smbj/issues/792 , and
# it's still an issue in 0.15.0.
smbj = { module = "com.hierynomus:smbj", version = "0.11.5" }
sshj = { module = "com.hierynomus:sshj", version = "0.41.2" }
telephoto-zoomable-image-coil = { module = "me.saket.telephoto:zoomable-image-coil3", version = "0.19.0" }
zhanghai-appiconloader = { module = "me.zhanghai.android.appiconloader:appiconloader", version = "1.5.0" }
zhanghai-libarchive = { module = "me.zhanghai.android.libarchive:library", version = "1.1.7" }
zhanghai-libselinux = { module = "me.zhanghai.android.libselinux:library", version = "2.1.1" }
zhanghai-retrofile = { module = "me.zhanghai.android.retrofile:library", version = "1.2.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
